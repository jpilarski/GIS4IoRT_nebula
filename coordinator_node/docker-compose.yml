services:
  coordinator:
    image: nebulastream/nes-executable-image:latest
    command:
     - nesCoordinator
     - --coordinatorHost=${COORDINATOR_IP}
     - --restIp=${COORDINATOR_IP}
     - --restPort=${REST_PORT}
     - --rpcPort=${RPC_PORT}
     - --worker.coordinatorHost=${COORDINATOR_IP}
     - --worker.coordinatorPort=${RPC_PORT}
     - --worker.localWorkerHost=${COORDINATOR_IP}
     - --worker.workerId=${WORKER_ID}
     - --configPath=/config/nebulastream/logical_sources.yml
    network_mode: host
    volumes:
      - ./config/nebulastream:/config/nebulastream
  mosquitto:
    image: eclipse-mosquitto
    network_mode: host
    volumes:
      - ./config/mosquitto:/mosquitto/config
  ui:
    image: nebulastream/nes-ui-image:latest
    network_mode: host
  subscriber:
    image: python:3-slim
    profiles: ["subscriber"]
    network_mode: host
    volumes:
      - ./scripts/subscriber.py:/app/subscriber.py
      - ./config/subscriber/requirements.txt:/app/requirements.txt
    command: >
      sh -c "pip install -r /app/requirements.txt && 
             python /app/subscriber.py ${COORDINATOR_IP} ${MQTT_PORT}"
  query_1a:
    image: curlimages/curl:latest
    profiles: ["query"]
    network_mode: host
    volumes:
      - ./config/query_1a:/query/
    command: >
      sh /query/run_query_1a.sh