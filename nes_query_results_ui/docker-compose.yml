services:

  mosquitto:
    image: eclipse-mosquitto
    network_mode: host
    volumes:
      - ./config:/mosquitto/config

  nes_ui:
    image: nebulastream/nes-ui-image:latest
    network_mode: host

  subscriber:
    build:
      context: .
      dockerfile: config/Dockerfile.subscriber
    network_mode: host
    volumes:
      - ./scripts:/scripts
    command: [ "python", "/scripts/subscriber.py", "${QUERY_HOST_IP}", "${QUERY_HOST_MQTT_PORT}", "${QUERY_NAME}" ]
    env_file: .env

  geofence_query:
    build:
      context: .
      dockerfile: config/Dockerfile.geofence
    network_mode: host
    volumes:
      - ./data:/data
    env_file: .env
    command: [ "/data/field/1_MONT.txt", "${QUERY_NAME}" ]
