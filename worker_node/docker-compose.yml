services:
  worker:
    image: nebulastream/nes-executable-image:latest
    profiles: ["all", "main"]
    network_mode: host
    volumes:
      - ./config/nebulastream:/config/nebulastream
    command: ["nesWorker", "--configPath=/config/nebulastream/worker_configuration.yml"]
    env_file: .env
  mosquitto:
    image: eclipse-mosquitto
    profiles: ["all", "main"]
    network_mode: host
    volumes:
      - ./config/mosquitto:/mosquitto/config
  ros2_play:
    build:
      context: .
      dockerfile: config/ros2_play/Dockerfile
    profiles: ["all", "ros2_play"]
    network_mode: host
    volumes:
      - ./bags:/bags
    command: ["ros2", "bag", "play", "/bags/france/leader_follower_ros2/", "-r", "7.5", "--topics", "/leader/gps/fix", "/follower/gps/fix"]
    env_file: .env
  ros2_mqtt:
    build:
      context: .
      dockerfile: config/ros2_mqtt/Dockerfile
    profiles: ["all", "ros2_mqtt"]
    network_mode: host
    volumes:
      - ./scripts:/scripts
    command: ["python3", "/scripts/ros2_mqtt.py", "${WORKER_IP}", "${MQTT_PORT}"]
    env_file: .env