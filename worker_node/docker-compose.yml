services:
  worker:
    image: nebulastream/nes-executable-image:latest
    command:
    - nesWorker
    # - --coordinatorHost=${COORDINATOR_IP}
    # - --coordinatorPort=${RPC_PORT}
    # - --localWorkerHost=${WORKER_IP}
    # - --workerId=${WORKER_ID}
    - --configPath=/config/nebulastream/physical_sources.yml
    network_mode: host
    volumes:
      - ./config/nebulastream:/config/nebulastream

  mosquitto:
    image: eclipse-mosquitto
    network_mode: host
    volumes:
      - ./config/mosquitto:/mosquitto/config

  ros-roscore:
    image: ros:noetic-ros-core
    container_name: ros-roscore
    entrypoint: /bin/bash
    command: -c "source /opt/ros/noetic/setup.bash && roscore"
    tty: true
    stdin_open: true

  ros-python:
    build:
      context: .
      dockerfile: config/ros-python/Dockerfile
    container_name: ros-python
    depends_on:
      - ros-roscore
    environment:
      - ROS_MASTER_URI=http://ros-roscore:11311
      - ROS_HOSTNAME=ros-python
    volumes:
      - ./bags:/bags
      - ./scripts:/scripts
      - ./config/ros-python/aliases.sh:/root/.bash_aliases
    tty: true
    stdin_open: true